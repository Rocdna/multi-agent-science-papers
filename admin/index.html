<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>阅读管理 · Multi-agent × AI 材料</title>
  <link rel="icon" href="../favicon.ico?v=2">
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/library.css">
  <link rel="stylesheet" href="../assets/reading.css">
  <link rel="stylesheet" href="../assets/admin.css">
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<a class="skip-link" href="#admin-papers">跳到论文列表</a>
<main class="admin-main">
  <header class="admin-header">
    <div><a href="../index.html">← 返回文献库</a><h1>阅读管理</h1><p>全站共用一份阅读状态，保存后在各设备展示。</p></div>
    <div class="admin-account"><span id="admin-account"></span><button id="admin-logout" type="button" class="btn btn-outline-secondary" hidden>退出登录</button></div>
  </header>
  <p id="admin-message" role="status" aria-live="polite">正在连接云端…</p>
  <a id="admin-open-site" class="btn btn-outline-primary" href="https://rocaler.asia/admin/" target="_blank" rel="noopener noreferrer" hidden>打开网站阅读管理</a>
  <button id="admin-retry" class="btn btn-outline-secondary" type="button" hidden>重试连接</button>
  <noscript><p>请启用 JavaScript 后使用阅读管理。</p></noscript>
  <form id="admin-login" class="admin-login" hidden>
    <label for="admin-password">管理员密码</label>
    <input id="admin-password" class="form-control" type="password" name="password" autocomplete="current-password" required maxlength="128">
    <button id="admin-signin" class="btn btn-primary" type="submit">登录</button>
  </form>
  <fieldset id="admin-editor" disabled hidden>
    <legend class="visually-hidden">论文阅读状态</legend>
    <div class="admin-controls">
      <label class="admin-search">搜索论文<input id="admin-search" class="form-control" type="search" placeholder="论文简称或标题" maxlength="160"></label>
      <label>阅读状态<select id="admin-filter" class="form-select"><option value="">全部</option><option value="unread">未读</option><option value="reading">阅读中</option><option value="read">已读</option></select></label>
      <button id="admin-reload" class="btn btn-outline-secondary" type="button">重新加载云端</button>
      <button id="admin-export" class="btn btn-outline-secondary" type="button">导出备份</button>
    </div>
    <div class="admin-bulk">
      <label><input id="admin-all" type="checkbox"> 选择当前结果</label>
      <span id="admin-selected">已选 0 篇</span>
      <label class="visually-hidden" for="admin-bulk-status">批量设为</label>
      <select id="admin-bulk-status" class="form-select"><option value="read">已读</option><option value="reading">阅读中</option><option value="unread">未读</option></select>
      <button id="admin-apply" class="btn btn-outline-primary" type="button" disabled>批量设定</button>
    </div>
    <div id="admin-papers" class="admin-papers" tabindex="-1"></div>
    <p id="admin-empty" hidden>没有符合条件的论文。</p>
    <div class="admin-savebar">
      <span id="admin-pending" role="status">没有待保存修改</span>
      <button id="admin-save" class="btn btn-primary" type="button" disabled>保存修改</button>
    </div>
  </fieldset>
</main>
<script src="../assets/paper-catalog.js"></script>
<script src="../assets/reading-data.js"></script>
<script src="../assets/admin.js"></script>
</body>
</html>
